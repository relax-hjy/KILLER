<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILLER · 大盘监控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/market.css">
</head>
<body>
<header>
  <h1>KILLER<span class="en">Market Monitor · Go Edition</span></h1>
  <nav></nav>
  <span id="clock"></span>
</header>

<main>
  <!-- 状态条：交易时段 / 数据源 / 错误 -->
  <div class="status" style="margin-bottom:16px">
    <span id="tradeState"><span class="dot off"></span>—</span>
    <span id="srcState">数据源: —</span>
    <span id="errState"></span>
  </div>

  <section class="cards" id="cards"></section>

  <section class="panel" style="margin-top:20px">
    <div class="chartbox-head">
      <h2 id="chartTitle">走势图</h2>
      <div class="tabs">
        <button id="tabIntraday" class="on" onclick="switchTab('intraday')">当日分时</button>
        <button id="tabKline" onclick="switchTab('kline')">日 K（120日）</button>
      </div>
    </div>
    <canvas id="chart"></canvas>
  </section>

  <section class="panel" style="margin-top:20px">
    <h2>告警记录 <span class="hint">（涨跌幅 / 振幅阈值，含冷却）</span></h2>
    <table>
      <thead><tr><th>时间</th><th>名称</th><th>类型</th><th>触发值</th><th>阈值</th><th>点位</th></tr></thead>
      <tbody id="alertBody"></tbody>
    </table>
    <div class="empty" id="alertEmpty" style="display:none">暂无告警 — 行情平稳 🎉</div>
  </section>
</main>

<footer>数据来源：东方财富 / 新浪财经（免费公开接口）· 仅供学习研究，不构成投资建议</footer>

<script src="/common.js"></script>
<script>
"use strict";
const STATE = { secid: null, tab: "intraday", quotes: [] };

/* ---------- 卡片排序（拖拽 + 持久化） ---------- */
const ORDER_KEY = "killer.cardOrder";   // localStorage 键：secid 顺序数组
let cardOrder = loadCardOrder();        // 用户自定义卡片顺序（secid 数组，空=用后端顺序）

function loadCardOrder() {
  try {
    const v = JSON.parse(localStorage.getItem(ORDER_KEY));
    return Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
  } catch { return []; }
}
function saveCardOrder() {
  try { localStorage.setItem(ORDER_KEY, JSON.stringify(cardOrder)); } catch {}
}

// 按用户自定义顺序重排卡片；不在 order 里的（新增标的）追加到末尾
function orderedQuotes() {
  if (!cardOrder.length) return STATE.quotes;
  const bySec = new Map(STATE.quotes.map(q => [q.secid, q]));
  const ordered = [];
  for (const sid of cardOrder) {
    const q = bySec.get(sid);
    if (q) { ordered.push(q); bySec.delete(sid); }
  }
  for (const q of STATE.quotes) if (bySec.has(q.secid)) ordered.push(q);
  return ordered;
}

/* ---------- 指数/全球卡片 ---------- */
function cardHTML(x, i) {
  return `
    <div class="card ${x.secid === STATE.secid ? "active" : ""}"
         draggable="true" data-secid="${x.secid}" data-idx="${i}"
         onclick="onCardClick('${x.secid}', '${x.name}')">
      <div class="name"><span>${x.name}</span><span class="code">${x.code}</span></div>
      <div class="price ${cls(x.pct)}">${fmt(x.price)}</div>
      <div class="delta ${cls(x.pct)}">${x.change >= 0 ? "+" : ""}${fmt(x.change)}　${pctStr(x.pct)}</div>
      <div class="sub"><span>高 ${fmt(x.high)}</span><span>低 ${fmt(x.low)}</span><span>振幅 ${fmt(x.amplitude)}%</span></div>
    </div>`;
}

// 点击卡片：切换走势图（全球标的无历史走势，仅显示实时行情）
function onCardClick(secid, name) {
  selectCard(secid);
}

function findQuote(secid) {
  return STATE.quotes.find(x => x.secid === secid);
}

function renderCards() {
  const ordered = orderedQuotes();
  if (ordered.length && (!STATE.secid || !ordered.some(x => x.secid === STATE.secid))) {
    // 当前选中的标的已不在监控列表（配置变更）→ 回落到第一个
    STATE.secid = ordered[0].secid;
  }
  $("cards").innerHTML = ordered.map(cardHTML).join("");
}

function selectCard(secid) {
  if (secid === STATE.secid) return;
  STATE.secid = secid;
  renderCards();
  drawChart(); // 数据未到位前显示"加载中"
  // 全球标的（znb_/hf_/hk）无历史走势，跳过拉取
  if (isGlobalSecid(secid)) return;
  loadCurrentTab().catch(e => {
    $("errState").innerHTML = `<span class="err">⚠ ${e.message}</span>`;
  });
}

/* ---------- 拖拽排序 ---------- */
let dragSecid = null;   // 正在拖拽的卡片 secid

function bindDrag() {
  const cardsEl = $("cards");
  cardsEl.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    dragSecid = card.dataset.secid;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragSecid); } catch {}
  });
  cardsEl.addEventListener("dragend", e => {
    const card = e.target.closest(".card");
    if (card) card.classList.remove("dragging");
    cardsEl.querySelectorAll(".drag-over").forEach(c => c.classList.remove("drag-over"));
    dragSecid = null;
  });
  cardsEl.addEventListener("dragover", e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const card = e.target.closest(".card");
    if (!card) return;
    cardsEl.querySelectorAll(".drag-over").forEach(c => { if (c !== card) c.classList.remove("drag-over"); });
    card.classList.add("drag-over");
  });
  cardsEl.addEventListener("dragleave", e => {
    const card = e.target.closest(".card");
    if (card && !card.contains(e.relatedTarget)) card.classList.remove("drag-over");
  });
  cardsEl.addEventListener("drop", e => {
    e.preventDefault();
    const target = e.target.closest(".card");
    if (!target || !dragSecid || target.dataset.secid === dragSecid) return;
    const ordered = orderedQuotes().map(q => q.secid);
    const from = ordered.indexOf(dragSecid);
    const to = ordered.indexOf(target.dataset.secid);
    if (from < 0 || to < 0) return;
    // 移除拖拽项并插入到目标位置
    ordered.splice(from, 1);
    ordered.splice(to, 0, dragSecid);
    cardOrder = ordered;
    saveCardOrder();
    renderCards();
  });
}

// 立即按当前 tab 拉取选中指数的数据（不等 10 秒轮询）
async function loadCurrentTab() {
  if (STATE.tab === "intraday") await loadIntraday();
  else await loadKline();
  drawChart();
}

/* ---------- 图表 ---------- */
let intradayData = [], klineData = [];
let intradayFor = "", klineFor = "";  // 数据属于哪个 secid
let loadSeq = 0;                      // 竞态序号：快速连点时丢弃过期响应

async function loadIntraday() {
  // 当日分时：直连数据源分钟 K（休市/重启后也能看全天）
  const seq = ++loadSeq, secid = STATE.secid;
  const data = await getJSON(`/api/intraday?secid=${secid}`);
  if (seq !== loadSeq) return;        // 已有更新的请求发出，丢弃本次结果
  intradayData = data; intradayFor = secid;
}
async function loadKline() {
  const seq = ++loadSeq, secid = STATE.secid;
  const data = await getJSON(`/api/kline?secid=${secid}&limit=120`);
  if (seq !== loadSeq) return;
  klineData = data; klineFor = secid;
}

function switchTab(tab) {
  STATE.tab = tab;
  $("tabIntraday").classList.toggle("on", tab === "intraday");
  $("tabKline").classList.toggle("on", tab === "kline");
  drawChart();
}

function drawChart() {
  const c = $("chart");
  const cur = findQuote(STATE.secid);
  $("chartTitle").textContent = (cur ? cur.name + " · " : "") +
    (STATE.tab === "intraday" ? "当日分时走势" : "日 K 收盘走势（120日）");

  // 全球标的无历史走势数据
  if (isGlobalSecid(STATE.secid)) {
    const { ctx, w, h } = setupCanvas(c, 300);
    drawHint(ctx, w, h, "该标的暂无历史走势数据（仅提供实时行情）");
    return;
  }

  if (STATE.tab === "intraday") {
    // 数据属于其他指数（切换中）→ 显示加载中，避免闪旧图
    if (intradayFor !== STATE.secid) {
      const { ctx, w, h } = setupCanvas(c, 300);
      drawHint(ctx, w, h, "加载中 …");
      return;
    }
    drawTimeSeries(c, intradayData, {
      height: 300, base: cur && cur.prev_close, showBaseLine: true,
      emptyText: "暂无分时数据（数据源可能未返回当日分钟线）",
    });
  } else {
    if (klineFor !== STATE.secid) {
      const { ctx, w, h } = setupCanvas(c, 300);
      drawHint(ctx, w, h, "加载中 …");
      return;
    }
    drawTimeSeries(c, klineData, { height: 300, emptyText: "暂无K线数据" });
  }
}

/* ---------- 板块成分股抽屉已移除（首页不再展示板块监控） ---------- */

/* ---------- 告警 ---------- */
const TYPE_LABEL = { change_up: "涨幅超限", change_down: "跌幅超限", amplitude: "振幅超限" };
function renderAlerts(list) {
  $("alertEmpty").style.display = list.length ? "none" : "block";
  $("alertBody").innerHTML = list.map(a => `
    <tr>
      <td class="num">${new Date(a.triggered_at).toLocaleString("zh-CN", {hour12:false})}</td>
      <td>${a.name}</td>
      <td><span class="badge ${a.type}">${TYPE_LABEL[a.type] || a.type}</span></td>
      <td class="num ${a.type === 'change_down' ? 'down' : 'up'}">${pctStr(a.value)}</td>
      <td class="num">${a.threshold.toFixed(2)}%</td>
      <td class="num">${fmt(a.price)}</td>
    </tr>`).join("");
}

/* ---------- 状态 ---------- */
function renderStatus(s) {
  const trading = s.trading_hours;
  $("tradeState").innerHTML = `<span class="dot ${trading ? "ok" : "off"}"></span>${trading ? "交易时段" : "休市"}`;
  $("srcState").textContent = `数据源: ${s.primary}` + (s.fallback ? ` → ${s.fallback}` : "");
  $("errState").innerHTML = s.last_error
    ? `<span class="err">⚠ ${s.last_error}</span>` : "";
}

/* ---------- 轮询 ---------- */
async function refresh() {
  try {
    const [quotes, alerts, status] = await Promise.all([
      getJSON("/api/quotes"), getJSON("/api/alerts?n=50"), getJSON("/api/status"),
    ]);
    STATE.quotes = quotes;
    renderCards();
    // 刷新当前 tab 数据（loadXxx 内部有 seq 竞态保护，过期响应会被丢弃）
    if (STATE.tab === "intraday" && !isGlobalSecid(STATE.secid)) { await loadIntraday(); drawChart(); }
    renderAlerts(alerts);
    renderStatus(status);
  } catch (e) {
    $("errState").innerHTML = `<span class="err">⚠ ${e.message}</span>`;
  }
  $("clock").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
}

// 判断是否全球标的（无历史走势）
// znb_/hf_ 前缀（新浪全球指数/商品）+ hk 前缀大写（腾讯港股指数 hkHSI/hkHSTECH）
function isGlobalSecid(secid) {
  if (!secid) return false;
  if (secid.startsWith("znb_") || secid.startsWith("hf_")) return true;
  return /^hk[A-Z]/.test(secid);
}

async function init() {
  await refresh();
  bindDrag();
  setInterval(refresh, 10000);
  setInterval(async () => {   // K线低频刷新即可
    if (STATE.tab === "kline" && !isGlobalSecid(STATE.secid)) { try { await loadKline(); drawChart(); } catch {} }
  }, 60000);
  window.addEventListener("resize", drawChart);
  // tab 切换：数据不属于当前指数才需要拉（加载中由 drawChart 兜底显示）
  const origSwitch = switchTab;
  window.switchTab = async t => {
    origSwitch(t);
    if (isGlobalSecid(STATE.secid)) return;
    try {
      if (t === "kline" && klineFor !== STATE.secid) await loadKline();
      if (t === "intraday" && intradayFor !== STATE.secid) await loadIntraday();
      drawChart();
    } catch (e) { console.error(e); }
  };
}

renderNav(NAV, "/");
startClock();
init();
</script>
</body>
</html>
