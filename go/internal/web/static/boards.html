<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILLER · A股板块</title>
<link rel="stylesheet" href="/market.css">
<style>
  /* 成分股表：名称列左对齐（默认规则只放前两列） */
  #detail th:nth-child(3), #detail td:nth-child(3) { text-align: left; }
  #detail .card, #watchCards .card { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>KILLER<span class="en">A股板块走势</span></h1>
  <nav></nav>
  <span id="clock"></span>
</header>

<main>
  <section id="watchSec" style="display:none">
    <h2 style="font-size:15px;font-weight:600;margin-bottom:12px">板块监控
      <span style="color:var(--muted);font-weight:400;font-size:12px">（config.yaml boards 配置 · 与大盘监控页同步）</span>
    </h2>
    <div class="cards" id="watchCards"></div>
  </section>

  <div class="stats" id="stats">加载中 …</div>

  <div class="toolbar">
    <div class="tabs">
      <button id="tabIndustry" class="on">行业板块</button>
      <button id="tabConcept">概念板块</button>
    </div>
    <div class="tabs">
      <button id="sortDesc" class="on">领涨优先</button>
      <button id="sortAsc">领跌优先</button>
    </div>
    <span style="color:var(--muted);font-size:12px">60 秒自动刷新</span>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr>
          <th style="width:36px">#</th>
          <th>板块</th>
          <th>点位</th>
          <th>涨跌幅</th>
          <th style="width:220px">涨/跌家数</th>
          <th class="nosort">热度</th>
        </tr>
      </thead>
      <tbody id="body"><tr><td colspan="6" class="loading">加载中 …</td></tr></tbody>
    </table>
  </div>
</main>

<!-- 板块成分股抽屉（选股范围 + 权重） -->
<div id="detail">
  <span class="close" onclick="closeBoard()">✕</span>
  <h2 id="bdName">—</h2>
  <div class="sub" id="bdSub">—</div>
  <div class="panel" style="margin-bottom:0">
    <table>
      <thead>
        <tr>
          <th style="width:36px">#</th>
          <th>代码</th><th>名称</th><th>现价</th>
          <th>涨跌幅</th><th>成交额</th><th>流通市值</th><th>权重</th>
        </tr>
      </thead>
      <tbody id="bdBody"><tr><td colspan="8" class="loading">加载中 …</td></tr></tbody>
    </table>
  </div>
  <div id="bdNote" style="margin-top:10px;font-size:12px;color:var(--muted)"></div>
</div>

<footer>数据来源：新浪财经 / 东方财富（免费公开接口）· 仅供学习研究，不构成投资建议</footer>

<script src="/common.js"></script>
<script>
"use strict";
const STATE = { kind: "industry", sort: "pct_desc" };

async function load() {
  $("body").innerHTML = `<tr><td colspan="6" class="loading">加载中 …</td></tr>`;
  try {
    const boards = await getJSON(`/api/boards?kind=${STATE.kind}&sort=${STATE.sort}`);
    render(boards);
  } catch (e) {
    $("body").innerHTML = `<tr><td colspan="6" class="empty">加载失败：${e.message}</td></tr>`;
  }
}

/* ---------- 板块监控（config.yaml boards 配置的监控标的） ---------- */
function watchCardHTML(x) {
  return `
    <div class="card" onclick="openBoard('${x.secid}', '${x.name}')">
      <div class="name"><span>${x.name}</span><span class="code">${x.code}</span></div>
      <div class="price ${cls(x.pct)}">${fmt(x.price)}</div>
      <div class="delta ${cls(x.pct)}">${x.change >= 0 ? "+" : ""}${fmt(x.change)}　${pctStr(x.pct)}</div>
      <div class="sub"><span>高 ${fmt(x.high)}</span><span>低 ${fmt(x.low)}</span><span>振幅 ${fmt(x.amplitude)}%</span></div>
    </div>`;
}

async function loadWatch() {
  try {
    const [boards, status] = await Promise.all([getJSON("/api/board-quotes"), getJSON("/api/status")]);
    const configured = status.boards || 0;
    $("watchSec").style.display = (boards.length || configured) ? "" : "none";
    if (!boards.length) {
      $("watchCards").innerHTML = configured
        ? `<div class="empty" style="grid-column:1/-1">行情暂不可用 — 数据源限流中，恢复后自动显示</div>` : "";
      return;
    }
    $("watchCards").innerHTML = boards.map(watchCardHTML).join("");
  } catch (e) {
    // 监控区加载失败不影响下方板块列表
  }
}

/* ---------- 成分股抽屉：选股范围 + 权重 ---------- */
async function openBoard(secid, name) {
  $("detail").classList.add("open");
  $("bdName").textContent = name || secid;
  $("bdSub").textContent = "成分股加载中 …";
  $("bdNote").textContent = "";
  $("bdBody").innerHTML = `<tr><td colspan="8" class="loading">加载中 …</td></tr>`;
  try {
    const list = await getJSON(`/api/board-members?secid=${encodeURIComponent(secid)}`);
    renderBoardMembers(list);
  } catch (e) {
    $("bdSub").textContent = "—";
    $("bdBody").innerHTML = `<tr><td colspan="8" class="empty">加载失败：${e.message}</td></tr>`;
  }
}

function closeBoard() { $("detail").classList.remove("open"); }

function renderBoardMembers(list) {
  const total = list.reduce((s, x) => s + (x.float_cap || 0), 0);
  const rows = [...list].sort((a, b) => (b.float_cap || 0) - (a.float_cap || 0));
  $("bdSub").textContent = `选股范围：共 ${list.length} 只 · 合计流通市值 ${fmtCap(total)} · 按权重降序（60 秒缓存）`;
  $("bdBody").innerHTML = rows.map((s, i) => {
    const w = total > 0 && s.float_cap > 0 ? (s.float_cap / total * 100).toFixed(2) + "%" : "—";
    return `<tr>
      <td style="color:var(--muted)">${i + 1}</td>
      <td>${s.code}</td>
      <td>${s.name}</td>
      <td>${fmt(s.price)}</td>
      <td class="${cls(s.pct)}">${pctStr(s.pct)}</td>
      <td>${fmtAmt(s.amount)}</td>
      <td>${fmtCap(s.float_cap)}</td>
      <td><b>${w}</b></td>
    </tr>`;
  }).join("") || `<tr><td colspan="8" class="empty">暂无成分股</td></tr>`;
  $("bdNote").textContent = "权重 = 个股流通市值 ÷ 成分股合计流通市值（近似口径；东财未发布板块指数真实权重）";
}

function render(boards) {
  // 统计：全市场涨跌分布（东财板块列表只返回前100，用返回集合统计并标注）
  const up = boards.filter(b => b.pct > 0).length;
  const dn = boards.filter(b => b.pct < 0).length;
  const flat = boards.length - up - dn;
  const top = boards.reduce((a, b) => b.pct > (a ? a.pct : -1e9) ? b : a, null);
  const maxAbs = Math.max(...boards.map(b => Math.abs(b.pct)), 0.01);
  $("stats").innerHTML =
    `<span><b class="up">${up}</b>上涨</span>` +
    `<span><b class="down">${dn}</b>下跌</span>` +
    `<span><b class="flat">${flat}</b>平盘</span>` +
    (top ? `<span>最强板块：<b class="${cls(top.pct)}">${top.name} ${pctStr(top.pct)}</b></span>` : "") +
    `<span style="color:var(--muted)">共 ${boards.length} 个板块（按${STATE.sort === "pct_desc" ? "涨幅" : "跌幅"}排序）</span>`;

  $("body").innerHTML = boards.map((b, i) => {
    const w = Math.max(3, Math.round(Math.abs(b.pct) / maxAbs * 140));
    const color = b.pct >= 0 ? "var(--up)" : "var(--down)";
    return `<tr>
      <td style="color:var(--muted)">${i + 1}</td>
      <td>${b.name} <span style="color:var(--muted);font-size:11px">${b.secid}</span></td>
      <td class="num">${fmt(b.price)}</td>
      <td class="${cls(b.pct)}">${pctStr(b.pct)}</td>
      <td>${b.up_count >= 0 ? `<span class="up">${b.up_count}</span> / <span class="down">${b.down_count}</span>` : "—"}</td>
      <td><span class="heat-wrap"><span class="heat" style="width:${w}px;background:${color}"></span></span></td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" class="empty">暂无数据</td></tr>`;
}

function setTab(kind) {
  STATE.kind = kind;
  $("tabIndustry").classList.toggle("on", kind === "industry");
  $("tabConcept").classList.toggle("on", kind === "concept");
  load();
}
function setSort(sort) {
  STATE.sort = sort;
  $("sortDesc").classList.toggle("on", sort === "pct_desc");
  $("sortAsc").classList.toggle("on", sort === "pct_asc");
  load();
}
$("tabIndustry").onclick = () => setTab("industry");
$("tabConcept").onclick = () => setTab("concept");
$("sortDesc").onclick = () => setSort("pct_desc");
$("sortAsc").onclick = () => setSort("pct_asc");

renderNav(NAV, "/boards.html");
startClock();
load();
loadWatch();
setInterval(load, 60000);
setInterval(loadWatch, 60000);
</script>
</body>
</html>
