<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILLER · 美股</title>
<link rel="stylesheet" href="/market.css">
</head>
<body>
<header>
  <h1>KILLER<span class="en">美股概览</span></h1>
  <nav></nav>
  <span id="clock"></span>
</header>

<main>
  <!-- 三大指数 -->
  <div class="cards" id="indices"><div class="card loading">加载中 …</div></div>

  <!-- 板块 -->
  <div class="toolbar">
    <strong style="font-size:15px">板块走势（SPDR 行业 ETF）</strong>
    <div class="tabs">
      <button id="secDesc" class="on">领涨优先</button>
      <button id="secAsc">领跌优先</button>
    </div>
    <span style="color:var(--muted);font-size:12px">60 秒刷新</span>
  </div>
  <div class="panel">
    <table>
      <thead><tr><th>代码</th><th>行业</th><th>现价</th><th>涨跌幅</th><th style="width:220px">相对涨跌</th></tr></thead>
      <tbody id="sectorBody"><tr><td colspan="5" class="loading">加载中 …</td></tr></tbody>
    </table>
  </div>

  <!-- 活跃个股 -->
  <div class="toolbar">
    <strong style="font-size:15px">成交活跃榜</strong>
    <div class="tabs">
      <button id="mAll" class="on">全部</button>
      <button id="mNas">纳斯达克</button>
      <button id="mNyse">纽交所</button>
    </div>
    <select id="usSort">
      <option value="f6">按成交额</option>
      <option value="f3">按涨幅</option>
      <option value="f20">按总市值</option>
    </select>
  </div>
  <div class="panel">
    <table>
      <thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>成交额</th><th>总市值</th></tr></thead>
      <tbody id="usBody"><tr><td colspan="6" class="loading">加载中 …</td></tr></tbody>
    </table>
    <div class="pager">
      <button id="prev">上一页</button>
      <span id="pageInfo">—</span>
      <button id="next">下一页</button>
    </div>
  </div>
</main>

<footer>数据来源：东方财富（免费公开接口）· 仅供学习研究，不构成投资建议</footer>

<script src="/common.js"></script>
<script>
"use strict";
const STATE = { secSort: "desc", page: 1, sort: "f6", market: "", total: 0, sectors: [] };

// ---- 三大指数 ----
async function loadIndices() {
  try {
    const ov = await getJSON("/api/us/overview");
    const idx = ov.indices || [], sec = ov.sectors || [];
    if (!idx.length && !sec.length) throw new Error("行情源暂不可用");
    $("indices").innerHTML = idx.length ? idx.map(x => `
      <div class="card">
        <div class="name"><span>${x.name}</span><span class="code">${x.code}</span></div>
        <div class="price ${cls(x.pct)}">${fmt(x.price)}</div>
        <div class="delta ${cls(x.pct)}">${x.change >= 0 ? "+" : ""}${fmt(x.change)}　${pctStr(x.pct)}</div>
        <div class="sub" style="margin-top:8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between">
          <span>高 ${fmt(x.high)}</span><span>低 ${fmt(x.low)}</span><span>开 ${fmt(x.open)}</span>
        </div>
      </div>`).join("")
      : `<div class="card" style="grid-column:1/-1;color:var(--muted);font-size:13px">三大指数暂不可用：指数行情当前仅东财提供（恢复后自动显示），下方板块数据正常</div>`;
    renderSectors(sec);
  } catch (e) {
    $("indices").innerHTML = `<div class="card empty">指数加载失败：${e.message}</div>`;
  }
}
function renderSectors(sectors) {
  STATE.sectors = sectors;
  const sorted = [...sectors].sort((a, b) =>
    STATE.secSort === "desc" ? b.pct - a.pct : a.pct - b.pct);
  const maxAbs = Math.max(...sorted.map(s => Math.abs(s.pct)), 0.01);
  $("sectorBody").innerHTML = sorted.map(s => {
    const w = Math.max(3, Math.round(Math.abs(s.pct) / maxAbs * 150));
    const color = s.pct >= 0 ? "var(--up)" : "var(--down)";
    return `<tr>
      <td>${s.code}</td><td>${s.name}</td>
      <td>${fmt(s.price)}</td>
      <td class="${cls(s.pct)}">${pctStr(s.pct)}</td>
      <td><span class="heat-wrap"><span class="heat" style="width:${w}px;background:${color}"></span>
        <span style="width:56px;text-align:right" class="${cls(s.pct)}">${pctStr(s.pct)}</span></span></td>
    </tr>`;
  }).join("") || `<tr><td colspan="5" class="empty">暂无数据</td></tr>`;
}

// ---- 活跃个股 ----
async function loadUS() {
  $("usBody").innerHTML = `<tr><td colspan="6" class="loading">加载中 …</td></tr>`;
  try {
    const r = await getJSON(`/api/us/stocks?page=${STATE.page}&sort=${STATE.sort}&market=${STATE.market}`);
    STATE.total = r.total;
    $("pageInfo").textContent = `第 ${STATE.page} 页 / 共 ${Math.max(1, Math.ceil(r.total / 50))} 页 · ${r.total} 只`;
    $("prev").disabled = STATE.page <= 1;
    $("usBody").innerHTML = r.items.map(s => `
      <tr>
        <td>${s.code}</td><td>${s.name}</td>
        <td>${fmt(s.price)}</td>
        <td class="${cls(s.pct)}">${pctStr(s.pct)}</td>
        <td>${fmtAmt(s.amount)}</td>
        <td>${fmtCap(s.market_cap)}</td>
      </tr>`).join("") || `<tr><td colspan="6" class="empty">暂无数据</td></tr>`;
  } catch (e) {
    $("usBody").innerHTML = `<tr><td colspan="6" class="empty">加载失败：${e.message}</td></tr>`;
  }
}

$("secDesc").onclick = () => { STATE.secSort = "desc"; $("secDesc").classList.add("on"); $("secAsc").classList.remove("on"); renderSectors(STATE.sectors); };
$("secAsc").onclick = () => { STATE.secSort = "asc"; $("secAsc").classList.add("on"); $("secDesc").classList.remove("on"); renderSectors(STATE.sectors); };
function setMarket(m) {
  STATE.market = m; STATE.page = 1;
  $("mAll").classList.toggle("on", m === "");
  $("mNas").classList.toggle("on", m === "105");
  $("mNyse").classList.toggle("on", m === "106");
  loadUS();
}
$("mAll").onclick = () => setMarket("");
$("mNas").onclick = () => setMarket("105");
$("mNyse").onclick = () => setMarket("106");
$("usSort").onchange = e => { STATE.sort = e.target.value; STATE.page = 1; loadUS(); };
$("prev").onclick = () => { if (STATE.page > 1) { STATE.page--; loadUS(); } };
$("next").onclick = () => { if (STATE.page * 50 < STATE.total) { STATE.page++; loadUS(); } };

renderNav(NAV, "/us.html");
startClock();
loadIndices();
loadUS();
setInterval(loadIndices, 60000);
setInterval(loadUS, 30000);
</script>
</body>
</html>
