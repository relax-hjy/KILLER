<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILLER · 美股</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/market.css">
</head>
<body>
<header>
  <h1>KILLER<span class="en">美股概览</span></h1>
  <nav></nav>
  <span id="clock"></span>
</header>

<main>
  <!-- 三大指数卡片（合并后原样保留） -->
  <div class="cards" id="indices"><div class="card loading">加载中 …</div></div>

  <!-- 板块走势 / 美股个股：一级 tab 并列切换 -->
  <div class="toolbar">
    <div class="tabs lv1">
      <button id="tabSector" class="on">板块走势</button>
      <button id="tabStock">美股个股</button>
    </div>
    <span class="hint">三大指数卡片常驻 · 板块与个股切换查看</span>
  </div>

  <!-- 一级 Tab A：板块走势 -->
  <div id="paneSector">
    <div class="toolbar">
      <div class="tabs">
        <button id="secDesc" class="on">领涨优先</button>
        <button id="secAsc">领跌优先</button>
      </div>
      <span class="hint">SPDR 11 行业 ETF · 60 秒刷新</span>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>代码</th><th>行业</th><th>现价</th><th>涨跌幅</th><th style="width:220px">相对涨跌</th></tr></thead>
        <tbody id="sectorBody"><tr><td colspan="5" class="loading">加载中 …</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 一级 Tab B：美股个股（二级 tab 切换活跃榜 / 纳指100 成分） -->
  <div id="paneStock" style="display:none">
    <div class="toolbar">
      <div class="tabs">
        <button id="tabActive" class="on">成交活跃榜</button>
        <button id="tabNDX">纳指100 成分</button>
      </div>
      <span class="hint">点击行查看日K/分时详情 · 30 秒刷新</span>
    </div>

    <!-- 二级 Tab 1：成交活跃榜 -->
    <div id="paneActive">
      <div class="toolbar">
        <div class="tabs">
          <button id="mAll" class="on">全部</button>
          <button id="mNas">纳斯达克</button>
          <button id="mNyse">纽交所</button>
        </div>
        <select id="usSort">
          <option value="f6">按成交额</option>
          <option value="f3">按涨幅</option>
          <option value="f20">按总市值</option>
        </select>
      </div>
      <div class="panel">
        <table>
          <thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>成交额</th><th>总市值</th></tr></thead>
          <tbody id="usBody"><tr><td colspan="6" class="loading">加载中 …</td></tr></tbody>
        </table>
        <div class="pager">
          <button id="prev">上一页</button>
          <span id="pageInfo">—</span>
          <button id="next">下一页</button>
        </div>
      </div>
    </div>

    <!-- 二级 Tab 2：纳指100 成分（原 /ndx.html 内容并入） -->
    <div id="paneNDX" style="display:none">
      <div class="stats" id="stats">加载中 …</div>
      <div class="toolbar">
        <input id="q" placeholder="筛选代码/名称（如 AAPL / 苹果）" style="width:260px">
        <select id="ndxSort">
          <option value="pct_desc">按涨幅</option>
          <option value="pct_asc">按跌幅</option>
          <option value="cap_desc">按总市值</option>
          <option value="code">按代码</option>
        </select>
      </div>
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th style="width:36px">#</th><th>代码</th><th>名称</th><th>现价</th>
              <th>涨跌幅</th><th>今开</th><th>最高</th><th>最低</th><th>总市值</th>
            </tr>
          </thead>
          <tbody id="ndxBody"><tr><td colspan="9" class="loading">加载中 …</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- 个股详情抽屉（两个 tab 共用） -->
<div id="detail">
  <span class="close" onclick="closeDetail()">✕</span>
  <h2 id="dName">—</h2>
  <div class="sub" id="dSub">—</div>
  <div style="display:flex;gap:8px;margin-bottom:12px" class="tabs">
    <button id="dKline" class="on">日 K（120日）</button>
    <button id="dIntraday">当日分时</button>
  </div>
  <canvas id="dChart"></canvas>
  <div class="kpis" id="dKpis"></div>
</div>

<footer>数据来源：腾讯财经 / 新浪财经 / 东方财富 + yfiua/index-constituents（纳指100 成分表月度更新）· 仅供学习研究，不构成投资建议</footer>

<script src="/common.js"></script>
<script>
"use strict";
const STATE = {
  // 指数 / 板块
  secSort: "desc", sectors: [],
  // 一级 tab：sector=板块走势，stock=美股个股
  pane: "sector",
  // 个股区
  activeTab: "active", usStocks: [], page: 1, sort: "f6", market: "", total: 0,
  ndxStocks: [], ndxSort: "pct_desc", q: "",
  // 详情抽屉
  detail: null, detailTab: "kline",
};

// ---- 三大指数 + 板块走势（合并后逻辑不变）----
async function loadIndices() {
  try {
    const ov = await getJSON("/api/us/overview");
    const idx = ov.indices || [], sec = ov.sectors || [];
    if (!idx.length && !sec.length) throw new Error("行情源暂不可用");
    $("indices").innerHTML = idx.length ? idx.map(x => `
      <div class="card">
        <div class="name"><span>${x.name}</span><span class="code">${x.code}</span></div>
        <div class="price ${cls(x.pct)}">${fmt(x.price)}</div>
        <div class="delta ${cls(x.pct)}">${x.change >= 0 ? "+" : ""}${fmt(x.change)}　${pctStr(x.pct)}</div>
        <div class="sub" style="margin-top:8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between">
          <span>高 ${fmt(x.high)}</span><span>低 ${fmt(x.low)}</span><span>开 ${fmt(x.open)}</span>
        </div>
      </div>`).join("")
      : `<div class="card" style="grid-column:1/-1;color:var(--muted);font-size:13px">三大指数暂不可用：指数行情当前仅东财提供（恢复后自动显示），下方板块数据正常</div>`;
    renderSectors(sec);
  } catch (e) {
    $("indices").innerHTML = `<div class="card empty">指数加载失败：${e.message}</div>`;
  }
}
function renderSectors(sectors) {
  STATE.sectors = sectors;
  const sorted = [...sectors].sort((a, b) =>
    STATE.secSort === "desc" ? b.pct - a.pct : a.pct - b.pct);
  const maxAbs = Math.max(...sorted.map(s => Math.abs(s.pct)), 0.01);
  $("sectorBody").innerHTML = sorted.map(s => {
    const w = Math.max(3, Math.round(Math.abs(s.pct) / maxAbs * 150));
    const color = s.pct >= 0 ? "var(--up)" : "var(--down)";
    return `<tr>
      <td>${s.code}</td><td>${s.name}</td>
      <td>${fmt(s.price)}</td>
      <td class="${cls(s.pct)}">${pctStr(s.pct)}</td>
      <td><span class="heat-wrap"><span class="heat" style="width:${w}px;background:${color}"></span>
        <span style="width:56px;text-align:right" class="${cls(s.pct)}">${pctStr(s.pct)}</span></span></td>
    </tr>`;
  }).join("") || `<tr><td colspan="5" class="empty">暂无数据</td></tr>`;
}

// ---- 一级 tab：板块走势 / 美股个股 ----
let stockTimer = null;
function refreshStock() { STATE.activeTab === "ndx" ? loadNDX() : loadUS(); }
function ensureStock() {
  // 个股区只在可见时拉取与轮询：东财限流期不为看不见的表格消耗请求
  const loaded = STATE.activeTab === "ndx" ? STATE.ndxStocks.length : STATE.usStocks.length;
  if (!loaded) refreshStock();
  clearInterval(stockTimer);
  stockTimer = setInterval(refreshStock, 30000);
}
function setPane(p) {
  STATE.pane = p;
  $("tabSector").classList.toggle("on", p === "sector");
  $("tabStock").classList.toggle("on", p === "stock");
  $("paneSector").style.display = p === "sector" ? "" : "none";
  $("paneStock").style.display = p === "stock" ? "" : "none";
  clearInterval(stockTimer);
  stockTimer = null;
  if (p === "stock") ensureStock();
}
$("tabSector").onclick = () => setPane("sector");
$("tabStock").onclick = () => setPane("stock");

// ---- 个股区二级 tab ----
function setTab(t) {
  STATE.activeTab = t;
  $("tabActive").classList.toggle("on", t === "active");
  $("tabNDX").classList.toggle("on", t === "ndx");
  $("paneActive").style.display = t === "active" ? "" : "none";
  $("paneNDX").style.display = t === "ndx" ? "" : "none";
  if (STATE.pane === "stock") ensureStock();
}
$("tabActive").onclick = () => setTab("active");
$("tabNDX").onclick = () => setTab("ndx");

// ---- Tab 1：成交活跃榜 ----
async function loadUS() {
  $("usBody").innerHTML = `<tr><td colspan="6" class="loading">加载中 …</td></tr>`;
  try {
    const r = await getJSON(`/api/us/stocks?page=${STATE.page}&sort=${STATE.sort}&market=${STATE.market}`);
    STATE.total = r.total;
    STATE.usStocks = r.items || [];
    $("pageInfo").textContent = `第 ${STATE.page} 页 / 共 ${Math.max(1, Math.ceil(STATE.total / 50))} 页 · ${STATE.total} 只`;
    $("prev").disabled = STATE.page <= 1;
    $("usBody").innerHTML = STATE.usStocks.map(s => `
      <tr data-secid="${s.secid}">
        <td>${s.code}</td><td>${s.name}</td>
        <td>${fmt(s.price)}</td>
        <td class="${cls(s.pct)}">${pctStr(s.pct)}</td>
        <td>${fmtAmt(s.amount)}</td>
        <td>${fmtCap(s.market_cap)}</td>
      </tr>`).join("") || `<tr><td colspan="6" class="empty">暂无数据</td></tr>`;
  } catch (e) {
    $("usBody").innerHTML = `<tr><td colspan="6" class="empty">加载失败：${e.message}（成交活跃榜仅东财提供，限流期暂不可用；可切到「纳指100 成分」tab 查看个股）</td></tr>`;
  }
}

// ---- Tab 2：纳指100 成分 ----
async function loadNDX() {
  try {
    STATE.ndxStocks = await getJSON("/api/ndx");
    renderNDX();
    renderStats();
  } catch (e) {
    $("ndxBody").innerHTML = `<tr><td colspan="9" class="empty">加载失败：${e.message}</td></tr>`;
    $("stats").textContent = "";
  }
}
function renderStats() {
  const list = STATE.ndxStocks;
  const quoted = list.filter(s => s.price > 0);
  const up = quoted.filter(s => s.pct > 0).length;
  const dn = quoted.filter(s => s.pct < 0).length;
  const top = quoted.reduce((a, b) => !a || b.pct > a.pct ? b : a, null);
  const worst = quoted.reduce((a, b) => !a || b.pct < a.pct ? b : a, null);
  $("stats").innerHTML =
    `<span><b>${list.length}</b>只成分</span>` +
    `<span><b class="up">${up}</b>上涨</span>` +
    `<span><b class="down">${dn}</b>下跌</span>` +
    (top ? `<span>领涨：<b class="up">${top.name} ${pctStr(top.pct)}</b></span>` : "") +
    (worst ? `<span>领跌：<b class="down">${worst.name} ${pctStr(worst.pct)}</b></span>` : "");
}
function ndxSorted() {
  const q = STATE.q.trim().toLowerCase();
  const list = STATE.ndxStocks.filter(s =>
    !q || s.code.toLowerCase().includes(q) || (s.name || "").toLowerCase().includes(q));
  const by = {
    pct_desc: (a, b) => b.pct - a.pct,
    pct_asc: (a, b) => a.pct - b.pct,
    cap_desc: (a, b) => b.market_cap - a.market_cap,
    code: (a, b) => a.code.localeCompare(b.code),
  }[STATE.ndxSort];
  return [...list].sort(by);
}
function renderNDX() {
  const list = ndxSorted();
  $("ndxBody").innerHTML = list.map((s, i) => `
    <tr data-secid="${s.secid}">
      <td style="color:var(--muted)">${i + 1}</td>
      <td><b>${s.code}</b></td>
      <td>${s.name || "—"}</td>
      <td>${s.price ? fmt(s.price) : "—"}</td>
      <td class="${s.price ? cls(s.pct) : "flat"}">${s.price ? pctStr(s.pct) : "—"}</td>
      <td>${s.open ? fmt(s.open) : "—"}</td>
      <td>${s.high ? fmt(s.high) : "—"}</td>
      <td>${s.low ? fmt(s.low) : "—"}</td>
      <td>${fmtCap(s.market_cap)}</td>
    </tr>`).join("") || `<tr><td colspan="9" class="empty">无匹配</td></tr>`;
}

// ---- 共用详情抽屉（两个 tab 的行点击都进这里）----
function openDetail(s) {
  STATE.detail = s;
  STATE.detailTab = "kline";
  $("dKline").classList.add("on");
  $("dIntraday").classList.remove("on");
  $("dName").textContent = `${s.name || s.code} · ${s.code}`;
  $("dSub").innerHTML = s.price
    ? `现价 <span class="${cls(s.pct)}">${fmt(s.price)}（${pctStr(s.pct)}）</span>`
    : "暂无行情（可能停牌）";
  $("dKpis").innerHTML = [
    ["今开", s.open], ["最高", s.high], ["最低", s.low],
    ["昨收", s.prev_close], ["涨跌额", s.change], ["总市值", fmtCap(s.market_cap)],
  ].map(([k, v]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${typeof v === "number" ? fmt(v) : v}</div></div>`).join("");
  $("detail").classList.add("open");
  loadDetailChart();
}
function closeDetail() { $("detail").classList.remove("open"); STATE.detail = null; }
function bindRowClick(tbody, getList) {
  $(tbody).addEventListener("click", e => {
    const tr = e.target.closest("tr");
    if (!tr || !tr.dataset.secid) return;
    const s = getList().find(x => x.secid === tr.dataset.secid);
    if (s) openDetail(s);
  });
}
bindRowClick("usBody", () => STATE.usStocks);
bindRowClick("ndxBody", () => STATE.ndxStocks);

async function loadDetailChart() {
  const s = STATE.detail;
  if (!s) return;
  const path = STATE.detailTab === "kline" ? "kline" : "intraday";
  try {
    const data = await getJSON(`/api/${path}?secid=${encodeURIComponent(s.secid)}${path === "kline" ? "&limit=120" : ""}`);
    drawDetail(data);
  } catch (e) {
    const { ctx, w, h } = setupCanvas($("dChart"), 260);
    drawHint(ctx, w, h, "图表加载失败（" + e.message + "）");
  }
}
function drawDetail(data) {
  drawTimeSeries($("dChart"), data, { height: 260, emptyText: "暂无数据", labelDigits: 1 });
}
$("dKline").onclick = () => {
  STATE.detailTab = "kline";
  $("dKline").classList.add("on"); $("dIntraday").classList.remove("on");
  loadDetailChart();
};
$("dIntraday").onclick = () => {
  STATE.detailTab = "intraday";
  $("dIntraday").classList.add("on"); $("dKline").classList.remove("on");
  loadDetailChart();
};

// ---- 交互绑定 ----
$("secDesc").onclick = () => { STATE.secSort = "desc"; $("secDesc").classList.add("on"); $("secAsc").classList.remove("on"); renderSectors(STATE.sectors); };
$("secAsc").onclick = () => { STATE.secSort = "asc"; $("secAsc").classList.add("on"); $("secDesc").classList.remove("on"); renderSectors(STATE.sectors); };
function setMarket(m) {
  STATE.market = m; STATE.page = 1;
  $("mAll").classList.toggle("on", m === "");
  $("mNas").classList.toggle("on", m === "105");
  $("mNyse").classList.toggle("on", m === "106");
  loadUS();
}
$("mAll").onclick = () => setMarket("");
$("mNas").onclick = () => setMarket("105");
$("mNyse").onclick = () => setMarket("106");
$("usSort").onchange = e => { STATE.sort = e.target.value; STATE.page = 1; loadUS(); };
$("prev").onclick = () => { if (STATE.page > 1) { STATE.page--; loadUS(); } };
$("next").onclick = () => { if (STATE.page * 50 < STATE.total) { STATE.page++; loadUS(); } };
$("q").addEventListener("input", e => { STATE.q = e.target.value; renderNDX(); });
$("ndxSort").addEventListener("change", e => { STATE.ndxSort = e.target.value; renderNDX(); });

renderNav(NAV, "/us.html");
startClock();
// 支持 ?tab=sector|active|ndx 直达对应 tab（旧 ?tab=ndx 链接继续可用）
const tabParam = new URLSearchParams(location.search).get("tab");
if (tabParam === "ndx") { setTab("ndx"); setPane("stock"); }
else if (tabParam === "active") setPane("stock");
loadIndices();          // 指数卡片 + 板块表（同一请求）
setInterval(loadIndices, 60000);
// 个股区的数据由 setPane/ensureStock 按需拉取，不在板块 tab 时空跑
</script>
</body>
</html>
