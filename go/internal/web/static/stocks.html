<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILLER · A股个股</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/market.css">
</head>
<body>
<header>
  <h1>KILLER<span class="en">A股个股监控</span></h1>
  <nav></nav>
  <span id="clock"></span>
</header>

<main>
  <!-- 自选区 -->
  <div class="panel">
    <h2>自选监控 <span class="hint">（涨跌幅超阈值自动告警，随大盘巡检 60s 一轮）</span></h2>
    <table>
      <thead>
        <tr>
          <th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>告警阈值</th><th class="nosort">操作</th>
        </tr>
      </thead>
      <tbody id="watchBody"><tr><td colspan="6" class="loading">加载中 …</td></tr></tbody>
    </table>
  </div>

  <!-- 全市场 -->
  <div class="toolbar">
    <input id="q" placeholder="输入代码筛选当前页（如 600519）" style="width:240px">
    <select id="sort">
      <option value="f3">按涨幅</option>
      <option value="f3asc">按跌幅</option>
      <option value="f6">按成交额</option>
      <option value="f8">按换手率</option>
      <option value="f20">按总市值</option>
      <option value="f12">按代码</option>
    </select>
    <span class="hint">点击行查看日K/分时详情 · 点★加/移出自选 · 30 秒刷新</span>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr>
          <th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>成交额</th><th>换手</th><th>市盈率</th><th>总市值</th>
        </tr>
      </thead>
      <tbody id="body"><tr><td colspan="8" class="loading">加载中 …</td></tr></tbody>
    </table>
    <div class="pager">
      <button id="prev">上一页</button>
      <span id="pageInfo">—</span>
      <button id="next">下一页</button>
    </div>
  </div>
</main>

<!-- 个股详情抽屉 -->
<div id="detail">
  <span class="close" onclick="closeDetail()">✕</span>
  <h2 id="dName">—</h2>
  <div class="sub" id="dSub">—</div>
  <div style="display:flex;gap:8px;margin-bottom:12px" class="tabs">
    <button id="dKline" class="on">日 K（120日）</button>
    <button id="dIntraday">当日分时</button>
  </div>
  <canvas id="dChart"></canvas>
  <div class="kpis" id="dKpis"></div>
</div>

<footer>数据来源：新浪财经 / 东方财富（免费公开接口）· 仅供学习研究，不构成投资建议</footer>

<script src="/common.js"></script>
<script>
"use strict";
const STATE = { page: 1, sort: "f3", asc: false, total: 0, stocks: [], watch: [], q: "", detail: null, detailTab: "kline" };

// ---- 自选 ----
async function loadWatch() {
  try {
    STATE.watch = await getJSON("/api/watch");
    renderWatch();
    renderStocks(); // 刷新星标状态
  } catch (e) {
    $("watchBody").innerHTML = `<tr><td colspan="6" class="empty">加载失败：${e.message}</td></tr>`;
  }
}
function isWatched(secid) { return STATE.watch.some(w => w.secid === secid); }
function renderWatch() {
  if (!STATE.watch.length) {
    $("watchBody").innerHTML = `<tr><td colspan="6" class="empty">暂无自选 — 点击下方列表任意一行加入</td></tr>`;
    return;
  }
  $("watchBody").innerHTML = STATE.watch.map(w => {
    const q = w.quote;
    return `<tr data-secid="${w.secid}">
      <td>${w.code}</td>
      <td>${w.name || (q ? q.name : "—")}</td>
      <td>${q ? fmt(q.price) : "—"}</td>
      <td class="${q ? cls(q.pct) : "flat"}">${q ? pctStr(q.pct) : "—"}</td>
      <td>${w.threshold.toFixed(1)}%</td>
      <td><span class="star on" title="移出自选">★</span></td>
    </tr>`;
  }).join("");
}
async function toggleWatch(stock) {
  if (isWatched(stock.secid)) {
    await fetch(`/api/watch?secid=${encodeURIComponent(stock.secid)}`, { method: "DELETE" });
    toast(`已移出自选：${stock.name}`);
  } else {
    // 默认阈值：A股 7%，北交所/高波动放宽；用户可在告警后调整（后续版本做编辑）
    const thr = stock.secid.startsWith("105.") || stock.secid.startsWith("106.") || stock.secid.startsWith("107.") ? 5 : 7;
    await fetch("/api/watch", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ secid: stock.secid, code: stock.code, name: stock.name, threshold: thr })
    });
    toast(`已加入自选：${stock.name}（阈值 ${thr}%）`);
  }
  await loadWatch();
}

// ---- 全市场列表 ----
async function loadStocks() {
  $("body").innerHTML = `<tr><td colspan="8" class="loading">加载中 …</td></tr>`;
  try {
    const r = await getJSON(`/api/stocks?page=${STATE.page}&sort=${STATE.sort}&asc=${STATE.asc ? 1 : 0}`);
    STATE.stocks = r.items;
    STATE.total = r.total;
    renderStocks();
  } catch (e) {
    $("body").innerHTML = `<tr><td colspan="8" class="empty">加载失败：${e.message}</td></tr>`;
  }
}
function renderStocks() {
  const q = STATE.q.trim();
  const rows = STATE.stocks.filter(s => !q || s.code.includes(q) || s.name.includes(q));
  $("pageInfo").textContent = `第 ${STATE.page} 页 / 共 ${Math.max(1, Math.ceil(STATE.total / 50))} 页 · ${STATE.total} 只`;
  $("prev").disabled = STATE.page <= 1;
  $("body").innerHTML = rows.map(s => `
    <tr data-secid="${s.secid}">
      <td><span class="star${isWatched(s.secid) ? " on" : ""}" title="${isWatched(s.secid) ? "移出自选" : "加入自选"}">★</span> ${s.code}</td>
      <td>${s.name}</td>
      <td>${fmt(s.price)}</td>
      <td class="${cls(s.pct)}">${pctStr(s.pct)}</td>
      <td>${fmtAmt(s.amount)}</td>
      <td>${fmt(s.turnover)}%</td>
      <td>${s.pe > 0 ? fmt(s.pe, 1) : "—"}</td>
      <td>${fmtCap(s.market_cap)}</td>
    </tr>`).join("") || `<tr><td colspan="8" class="empty">本页无匹配</td></tr>`;
}

$("body").addEventListener("click", async e => {
  const tr = e.target.closest("tr");
  if (!tr || !tr.dataset.secid) return;
  const s = STATE.stocks.find(x => x.secid === tr.dataset.secid);
  if (!s) return;
  if (e.target.closest(".star")) { await toggleWatch(s); loadStocks(); return; }
  openDetail(s);
});
$("watchBody").addEventListener("click", async e => {
  const tr = e.target.closest("tr");
  if (!tr || !tr.dataset.secid) return;
  const w = STATE.watch.find(x => x.secid === tr.dataset.secid);
  if (!w) return;
  if (e.target.closest(".star")) {
    await fetch(`/api/watch?secid=${encodeURIComponent(tr.dataset.secid)}`, { method: "DELETE" });
    toast("已移出自选");
    await loadWatch();
    loadStocks();
    return;
  }
  openDetail({ ...(w.quote || {}), secid: w.secid, code: w.code, name: w.name || (w.quote && w.quote.name) || "" });
});

// ---- 详情抽屉 ----
const num = v => typeof v === "number" && !Number.isNaN(v) ? fmt(v) : "—";
const kpiCap = v => typeof v === "number" && !Number.isNaN(v) ? fmtCap(v) : "—";
const kpiAmt = v => typeof v === "number" && !Number.isNaN(v) ? fmtAmt(v) : "—";

function openDetail(s) {
  STATE.detail = s;
  STATE.detailTab = "kline";
  $("dKline").classList.add("on");
  $("dIntraday").classList.remove("on");
  $("dName").textContent = `${s.name || s.code} · ${s.code}`;
  $("dSub").innerHTML = s.price
    ? `现价 <span class="${cls(s.pct)}">${fmt(s.price)}（${pctStr(s.pct)}）</span>`
    : "暂无行情（可能停牌）";
  $("dKpis").innerHTML = [
    ["今开", num(s.open)], ["最高", num(s.high)], ["最低", num(s.low)],
    ["昨收", num(s.prev_close)], ["涨跌额", num(s.change)], ["总市值", kpiCap(s.market_cap)],
    ["成交额", kpiAmt(s.amount)], ["换手率", s.turnover ? fmt(s.turnover) + "%" : "—"],
    ["市盈率", s.pe > 0 ? fmt(s.pe, 1) : "—"],
  ].map(([k, v]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  $("detail").classList.add("open");
  loadDetailChart();
}
function closeDetail() { $("detail").classList.remove("open"); STATE.detail = null; }

async function loadDetailChart() {
  const s = STATE.detail;
  if (!s) return;
  const path = STATE.detailTab === "kline" ? "kline" : "intraday";
  try {
    const data = await getJSON(`/api/${path}?secid=${encodeURIComponent(s.secid)}${path === "kline" ? "&limit=120" : ""}`);
    drawDetail(data);
  } catch (e) {
    const { ctx, w, h } = setupCanvas($("dChart"), 260);
    drawHint(ctx, w, h, "图表加载失败（" + e.message + "）");
  }
}

function drawDetail(data) {
  drawTimeSeries($("dChart"), data, {
    height: 260,
    emptyText: "暂无数据",
    labelDigits: 2,
  });
}

$("dKline").onclick = () => {
  STATE.detailTab = "kline";
  $("dKline").classList.add("on"); $("dIntraday").classList.remove("on");
  loadDetailChart();
};
$("dIntraday").onclick = () => {
  STATE.detailTab = "intraday";
  $("dIntraday").classList.add("on"); $("dKline").classList.remove("on");
  loadDetailChart();
};

$("q").addEventListener("input", e => { STATE.q = e.target.value; renderStocks(); });
$("sort").addEventListener("change", e => {
  const v = e.target.value;
  if (v === "f3asc") { STATE.sort = "f3"; STATE.asc = true; }
  else { STATE.sort = v; STATE.asc = false; }
  STATE.page = 1;
  loadStocks();
});
$("prev").onclick = () => { if (STATE.page > 1) { STATE.page--; loadStocks(); } };
$("next").onclick = () => {
  if (STATE.page * 50 < STATE.total) { STATE.page++; loadStocks(); }
};

renderNav(NAV, "/stocks.html");
startClock();
loadWatch();
loadStocks();
setInterval(loadStocks, 30000);
setInterval(loadWatch, 15000);
</script>
</body>
</html>
