<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILLER · A股个股</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/market.css">
<style>
/* 详情抽屉：主营业务 / 财报摘要 tab（仅本页） */
.f10-head {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  margin-top: 16px; padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}
.hold-period { font-size: var(--font-meta); color: var(--text-tertiary); white-space: nowrap; }
.hold-note { font-size: var(--font-table); color: var(--text-tertiary); padding: 10px 0; }
#dF10, #dFin { margin-top: 6px; }
#dF10 .f10-text { font-size: var(--font-table); color: var(--text-secondary); line-height: 1.7; margin: 4px 0 8px; }
#dF10 .f10-label { color: var(--text-tertiary); }
/* 数值列右对齐 + 等宽数字，避免表格列头错位（与全站表头约定一致） */
#dF10 td:nth-child(n+3), #dF10 th:nth-child(n+3),
#dFin td:not(:first-child), #dFin th:not(:first-child) {
  text-align: right; font-variant-numeric: tabular-nums;
}
/* 财报转置表：首列为指标名（左对齐、次要色），单元格内主值+同比小字 */
#dFin td:first-child { color: var(--text-tertiary); white-space: nowrap; }
#dFin td .v { color: var(--text-primary); }
#dFin .yoy { display: block; font-size: var(--font-meta); line-height: 1.3; }
</style>
</head>
<body>
<header>
  <h1>KILLER<span class="en">A股个股监控</span></h1>
  <nav></nav>
  <span id="clock"></span>
</header>

<main>
  <!-- 自选区 -->
  <div class="panel">
    <h2>自选监控 <span class="hint">（涨跌幅超阈值自动告警，随大盘巡检 60s 一轮）</span></h2>
    <table>
      <thead>
        <tr>
          <th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>告警阈值</th><th class="nosort">操作</th>
        </tr>
      </thead>
      <tbody id="watchBody"><tr><td colspan="6" class="loading">加载中 …</td></tr></tbody>
    </table>
  </div>

  <!-- 全市场 -->
  <div class="toolbar">
    <input id="q" placeholder="代码/名称/拼音搜索全市场（6 位代码直达）" style="width:240px">
    <select id="sort">
      <option value="f20" selected>按总市值</option>
      <option value="f3">按涨幅</option>
      <option value="f3asc">按跌幅</option>
      <option value="f6">按成交额</option>
      <option value="f8">按换手率</option>
      <option value="f12">按代码</option>
    </select>
    <span class="hint">点击行查看日K/分时详情 · 点★加/移出自选 · 30 秒刷新</span>
  </div>

  <!-- 全市场搜索结果（联想） -->
  <div class="panel" id="searchPanel" style="display:none">
    <h2>全市场匹配 <span class="hint" id="searchHint"></span></h2>
    <table>
      <thead>
        <tr>
          <th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>成交额</th><th>总市值</th><th class="nosort">自选</th>
        </tr>
      </thead>
      <tbody id="searchBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr>
          <th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>成交额</th><th>换手</th><th>市盈率</th><th>总市值</th>
        </tr>
      </thead>
      <tbody id="body"><tr><td colspan="8" class="loading">加载中 …</td></tr></tbody>
    </table>
    <div class="pager">
      <button id="prev">上一页</button>
      <span id="pageInfo">—</span>
      <button id="next">下一页</button>
    </div>
  </div>
</main>

<!-- 个股详情抽屉 -->
<div id="detail">
  <span class="close" onclick="closeDetail()">✕</span>
  <h2 id="dName">—</h2>
  <div class="sub" id="dSub">—</div>
  <div style="display:flex;gap:8px;margin-bottom:12px" class="tabs">
    <button id="dKline" class="on">日 K（250日）</button>
    <button id="dIntraday">当日分时</button>
  </div>
  <canvas id="dChart"></canvas>
  <div class="kpis" id="dKpis"></div>
  <div class="f10-head">
    <div style="display:flex;gap:8px" class="tabs">
      <button id="dBiz" class="on">主营业务</button>
      <button id="dFinTab">财报摘要</button>
    </div>
    <span class="hold-period" id="dF10Meta"></span>
  </div>
  <div id="dF10"><div class="hold-note">加载中 …</div></div>
  <div id="dFin" style="display:none"><div class="hold-note">加载中 …</div></div>
</div>

<footer>数据来源：新浪财经 / 东方财富（免费公开接口）· 仅供学习研究，不构成投资建议</footer>

<script src="/common.js"></script>
<script>
"use strict";
const STATE = { page: 1, sort: "f20", asc: false, total: 0, stocks: [], watch: [], q: "", search: [], detail: null, detailTab: "kline", f10Tab: "biz", f10: null };

// ---- 自选 ----
async function loadWatch() {
  try {
    STATE.watch = await getJSON("/api/watch");
    renderWatch();
    renderStocks(); // 刷新星标状态
  } catch (e) {
    $("watchBody").innerHTML = `<tr><td colspan="6" class="empty">加载失败：${e.message}</td></tr>`;
  }
}
function isWatched(secid) { return STATE.watch.some(w => w.secid === secid); }
function renderWatch() {
  if (!STATE.watch.length) {
    $("watchBody").innerHTML = `<tr><td colspan="6" class="empty">暂无自选 — 点击下方列表任意一行加入</td></tr>`;
    return;
  }
  $("watchBody").innerHTML = STATE.watch.map(w => {
    const q = w.quote;
    return `<tr data-secid="${w.secid}">
      <td>${w.code}</td>
      <td>${w.name || (q ? q.name : "—")}</td>
      <td>${q ? fmt(q.price) : "—"}</td>
      <td class="${q ? cls(q.pct) : "flat"}">${q ? pctStr(q.pct) : "—"}</td>
      <td>${w.threshold.toFixed(1)}%</td>
      <td><span class="star on" title="移出自选">★</span></td>
    </tr>`;
  }).join("");
}
async function toggleWatch(stock) {
  if (isWatched(stock.secid)) {
    await fetch(`/api/watch?secid=${encodeURIComponent(stock.secid)}`, { method: "DELETE" });
    toast(`已移出自选：${stock.name}`);
  } else {
    // 默认阈值：A股 7%，北交所/高波动放宽；用户可在告警后调整（后续版本做编辑）
    const thr = stock.secid.startsWith("105.") || stock.secid.startsWith("106.") || stock.secid.startsWith("107.") ? 5 : 7;
    await fetch("/api/watch", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ secid: stock.secid, code: stock.code, name: stock.name, threshold: thr })
    });
    toast(`已加入自选：${stock.name}（阈值 ${thr}%）`);
  }
  await loadWatch();
}

// ---- 全市场列表 ----
async function loadStocks() {
  $("body").innerHTML = `<tr><td colspan="8" class="loading">加载中 …</td></tr>`;
  try {
    const r = await getJSON(`/api/stocks?page=${STATE.page}&sort=${STATE.sort}&asc=${STATE.asc ? 1 : 0}`);
    STATE.stocks = r.items;
    STATE.total = r.total;
    renderStocks();
  } catch (e) {
    $("body").innerHTML = `<tr><td colspan="8" class="empty">加载失败：${e.message}</td></tr>`;
  }
}
function renderStocks() {
  const rows = STATE.stocks;
  $("pageInfo").textContent = `第 ${STATE.page} 页 / 共 ${Math.max(1, Math.ceil(STATE.total / 50))} 页 · ${STATE.total} 只`;
  $("prev").disabled = STATE.page <= 1;
  $("body").innerHTML = rows.map(s => `
    <tr data-secid="${s.secid}">
      <td><span class="star${isWatched(s.secid) ? " on" : ""}" title="${isWatched(s.secid) ? "移出自选" : "加入自选"}">★</span> ${s.code}</td>
      <td>${s.name}</td>
      <td>${fmt(s.price)}</td>
      <td class="${cls(s.pct)}">${pctStr(s.pct)}</td>
      <td>${fmtAmt(s.amount)}</td>
      <td>${fmt(s.turnover)}%</td>
      <td>${s.pe > 0 ? fmt(s.pe, 1) : "—"}</td>
      <td>${fmtCap(s.market_cap)}</td>
    </tr>`).join("") || `<tr><td colspan="8" class="empty">本页无匹配</td></tr>`;
}

// ---- 全市场搜索 ----
// 主表只有 50 行，翻页前的输入框过滤等于"搜不到"，所以关键词一律走后端联想。
let searchTimer = 0;
let searchSeq = 0;
async function searchGlobal(kw) {
  const panel = $("searchPanel");
  if (!kw) { panel.style.display = "none"; STATE.search = []; return; }
  const seq = ++searchSeq;
  panel.style.display = "";
  $("searchHint").textContent = `搜索「${kw}」…`;
  $("searchBody").innerHTML = `<tr><td colspan="7" class="loading">搜索中 …</td></tr>`;
  try {
    const r = await getJSON(`/api/stocks/search?q=${encodeURIComponent(kw)}&n=10`);
    if (seq !== searchSeq) return; // 输入已被更新一次按键取代
    STATE.search = r.items;
    renderSearch(kw);
    // 6 位代码精确命中 → 直达详情
    if (/^\d{6}$/.test(kw) && r.items.length && r.items[0].code === kw) openDetail(r.items[0]);
  } catch (e) {
    if (seq !== searchSeq) return;
    STATE.search = [];
    $("searchHint").textContent = `搜索「${kw}」`;
    $("searchBody").innerHTML = `<tr><td colspan="7" class="empty">搜索失败：${e.message}</td></tr>`;
  }
}
function renderSearch(kw) {
  const items = STATE.search;
  $("searchHint").textContent = `搜索「${kw}」· ${items.length} 只`;
  $("searchBody").innerHTML = items.map(s => `
    <tr data-secid="${s.secid}">
      <td>${s.code}</td>
      <td>${s.name || "—"}</td>
      <td>${s.price ? fmt(s.price) : "—"}</td>
      <td class="${cls(s.pct)}">${s.price ? pctStr(s.pct) : "—"}</td>
      <td>${fmtAmt(s.amount)}</td>
      <td>${fmtCap(s.market_cap)}</td>
      <td><span class="star${isWatched(s.secid) ? " on" : ""}" title="${isWatched(s.secid) ? "移出自选" : "加入自选"}">★</span></td>
    </tr>`).join("") || `<tr><td colspan="7" class="empty">无匹配 A 股（本搜索只覆盖沪深北，不含港股/美股/基金）</td></tr>`;
}
$("searchBody").addEventListener("click", async e => {
  const tr = e.target.closest("tr");
  if (!tr || !tr.dataset.secid) return;
  const s = STATE.search.find(x => x.secid === tr.dataset.secid);
  if (!s) return;
  if (e.target.closest(".star")) { await toggleWatch(s); renderSearch(STATE.q.trim()); return; }
  openDetail(s);
});

$("body").addEventListener("click", async e => {
  const tr = e.target.closest("tr");
  if (!tr || !tr.dataset.secid) return;
  const s = STATE.stocks.find(x => x.secid === tr.dataset.secid);
  if (!s) return;
  if (e.target.closest(".star")) { await toggleWatch(s); loadStocks(); return; }
  openDetail(s);
});
$("watchBody").addEventListener("click", async e => {
  const tr = e.target.closest("tr");
  if (!tr || !tr.dataset.secid) return;
  const w = STATE.watch.find(x => x.secid === tr.dataset.secid);
  if (!w) return;
  if (e.target.closest(".star")) {
    await fetch(`/api/watch?secid=${encodeURIComponent(tr.dataset.secid)}`, { method: "DELETE" });
    toast("已移出自选");
    await loadWatch();
    loadStocks();
    return;
  }
  openDetail({ ...(w.quote || {}), secid: w.secid, code: w.code, name: w.name || (w.quote && w.quote.name) || "" });
});

// ---- 详情抽屉 ----
const num = v => typeof v === "number" && !Number.isNaN(v) ? fmt(v) : "—";
const kpiCap = v => typeof v === "number" && !Number.isNaN(v) ? fmtCap(v) : "—";
const kpiAmt = v => typeof v === "number" && !Number.isNaN(v) ? fmtAmt(v) : "—";

function openDetail(s) {
  STATE.detail = s;
  STATE.detailTab = "kline";
  STATE.f10 = null;
  STATE.f10Tab = "biz";
  $("dKline").classList.add("on");
  $("dIntraday").classList.remove("on");
  switchF10Tab("biz");
  $("dName").textContent = `${s.name || s.code} · ${s.code}`;
  $("dSub").innerHTML = s.price
    ? `现价 <span class="${cls(s.pct)}">${fmt(s.price)}（${pctStr(s.pct)}）</span>`
    : "暂无行情（可能停牌）";
  $("dKpis").innerHTML = [
    ["今开", num(s.open)], ["最高", num(s.high)], ["最低", num(s.low)],
    ["昨收", num(s.prev_close)], ["涨跌额", num(s.change)], ["总市值", kpiCap(s.market_cap)],
    ["成交额", kpiAmt(s.amount)], ["换手率", s.turnover ? fmt(s.turnover) + "%" : "—"],
    ["市盈率", s.pe > 0 ? fmt(s.pe, 1) : "—"],
  ].map(([k, v]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  $("detail").classList.add("open");
  loadDetailChart();
  loadF10(s);
}
function closeDetail() { $("detail").classList.remove("open"); STATE.detail = null; }

async function loadDetailChart() {
  const s = STATE.detail;
  if (!s) return;
  const path = STATE.detailTab === "kline" ? "kline" : "intraday";
  try {
    const data = await getJSON(`/api/${path}?secid=${encodeURIComponent(s.secid)}${path === "kline" ? "&limit=250" : ""}`);
    drawDetail(data);
  } catch (e) {
    const { ctx, w, h } = setupCanvas($("dChart"), 260);
    drawHint(ctx, w, h, "图表加载失败（" + e.message + "）");
  }
}

function drawDetail(data) {
  drawTimeSeries($("dChart"), data, {
    height: 260,
    emptyText: "暂无数据",
    labelDigits: 2,
  });
}

// ---- 主营与财报（/api/f10，东财 F10，后端 30 分钟缓存）----
// 两个区块数据一次拉全，用「主营业务 / 财报摘要」tab 并列切换展示。
const esc = v => String(v ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f10MetaFor = tab => {
  const d = STATE.f10;
  if (!d) return "";
  if (tab === "fin") return d.finance && d.finance.length ? `最近 ${d.finance.length} 期 · 累计口径 · 东财 F10` : "";
  return [d.industry, d.main_op_period].filter(Boolean).join(" · ");
};
function switchF10Tab(tab) {
  STATE.f10Tab = tab;
  $("dBiz").classList.toggle("on", tab === "biz");
  $("dFinTab").classList.toggle("on", tab === "fin");
  $("dF10").style.display = tab === "biz" ? "" : "none";
  $("dFin").style.display = tab === "fin" ? "" : "none";
  $("dF10Meta").textContent = f10MetaFor(tab);
}
$("dBiz").onclick = () => switchF10Tab("biz");
$("dFinTab").onclick = () => switchF10Tab("fin");

async function loadF10(s) {
  const note = `<div class="hold-note">主营与财报暂不可用（东财限流期降级，恢复后自动显示）</div>`;
  $("dF10Meta").textContent = "";
  $("dF10").innerHTML = `<div class="hold-note">加载中 …</div>`;
  $("dFin").innerHTML = `<div class="hold-note">加载中 …</div>`;
  if (!s || !s.secid) {
    $("dF10").innerHTML = $("dFin").innerHTML = `<div class="hold-note">缺少 secid，无法查询</div>`;
    return;
  }
  let d;
  try {
    d = await getJSON(`/api/f10?secid=${encodeURIComponent(s.secid)}`);
  } catch (e) {
    $("dF10").innerHTML = $("dFin").innerHTML = note;
    return;
  }
  if (!STATE.detail || STATE.detail.secid !== s.secid) return; // 抽屉已切走，丢弃过期响应
  renderF10(d);
}
function renderF10(d) {
  STATE.f10 = d;
  const profile = (d.profile || "").trim();
  const scope = (d.business_scope || "").trim();
  const ops = d.main_ops || [];
  let html = "";
  if (profile) html += `<div class="f10-text"><span class="f10-label">简介 · </span>${esc(profile)}</div>`;
  if (scope) html += `<div class="f10-text"><span class="f10-label">经营范围 · </span>${esc(scope)}</div>`;
  if (ops.length) {
    html += `<table><thead><tr><th>分类</th><th>项目</th><th>主营收入</th><th>占比</th><th>毛利率</th></tr></thead><tbody>` +
      ops.map(o => `<tr>
        <td>${esc(o.kind)}</td>
        <td>${esc(o.name)}</td>
        <td>${fmtAmt(o.income)}</td>
        <td>${fmt(o.ratio)}%</td>
        <td>${o.margin > 0 ? fmt(o.margin) + "%" : "—"}</td>
      </tr>`).join("") + `</tbody></table>`;
  }
  $("dF10").innerHTML = html || `<div class="hold-note">暂无主营数据</div>`;

  const fin = d.finance || [];
  if (!fin.length) { $("dFin").innerHTML = `<div class="hold-note">暂无财报数据</div>`; $("dF10Meta").textContent = f10MetaFor(STATE.f10Tab); return; }
  // 转置对比表：行=指标、列=报告期（560px 抽屉内信息密度最高，年报/季报横向可比）
  const yoy = v => `<span class="yoy ${cls(v)}">${pctStr(v)}</span>`;
  const amt = (v, y) => {
    if (!v) return "—";
    const s = (v < 0 ? "-" : "") + fmtAmt(Math.abs(v));
    return `<span class="v">${s}</span>` + (y == null ? "" : yoy(y));
  };
  const pct = v => v ? `<span class="v">${fmt(v, 1)}%</span>` : "—";
  const num = v => v ? `<span class="v">${fmt(v, 2)}</span>` : "—";
  const rows = [
    ["营业总收入", f => amt(f.revenue, f.revenue_yoy)],
    ["归母净利润", f => amt(f.profit, f.profit_yoy)],
    ["扣非净利润", f => amt(f.deduct, f.deduct_yoy)],
    ["销售毛利率", f => pct(f.margin)],
    ["销售净利率", f => pct(f.net_margin)],
    ["加权 ROE", f => pct(f.roe)],
    ["基本每股收益", f => num(f.eps)],
    ["每股净资产", f => num(f.bps)],
    ["资产负债率", f => pct(f.debt_ratio)],
    ["经营现金流", f => amt(f.operate_cash, null)],
    ["总资产", f => amt(f.total_assets, null)],
  ];
  $("dFin").innerHTML =
    `<table><thead><tr><th>指标</th>` +
    fin.map(f => `<th>${esc(f.period)}</th>`).join("") +
    `</tr></thead><tbody>` +
    rows.map(([name, cell]) =>
      `<tr><td>${esc(name)}</td>` + fin.map(f => `<td>${cell(f)}</td>`).join("") + `</tr>`
    ).join("") + `</tbody></table>`;
  $("dF10Meta").textContent = f10MetaFor(STATE.f10Tab);
}

$("dKline").onclick = () => {
  STATE.detailTab = "kline";
  $("dKline").classList.add("on"); $("dIntraday").classList.remove("on");
  loadDetailChart();
};
$("dIntraday").onclick = () => {
  STATE.detailTab = "intraday";
  $("dIntraday").classList.add("on"); $("dKline").classList.remove("on");
  loadDetailChart();
};

$("q").addEventListener("input", e => {
  STATE.q = e.target.value;
  const kw = STATE.q.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => searchGlobal(kw), kw ? 350 : 0);
});
$("sort").addEventListener("change", e => {
  const v = e.target.value;
  if (v === "f3asc") { STATE.sort = "f3"; STATE.asc = true; }
  else { STATE.sort = v; STATE.asc = false; }
  STATE.page = 1;
  loadStocks();
});
$("prev").onclick = () => { if (STATE.page > 1) { STATE.page--; loadStocks(); } };
$("next").onclick = () => {
  if (STATE.page * 50 < STATE.total) { STATE.page++; loadStocks(); }
};

renderNav(NAV, "/stocks.html");
startClock();
loadWatch();
loadStocks();
setInterval(loadStocks, 30000);
setInterval(loadWatch, 15000);
</script>
</body>
</html>
