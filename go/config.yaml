# --- 监控的全球指数/大宗商品（新浪 znb_ 全球指数 / hf_ 商品期货）---
# 显示在大盘监控首页，加在指数（科创50）之后
globals:
  - secid: "hf_CL"
    name: "石油（WTI原油）"
  - secid: "znb_NKY"
    name: "日经225"
  - secid: "znb_KOSPI"
    name: "韩国综指"
  - secid: "hf_GC"
    name: "黄金（纽约金）"
  - secid: "znb_NDX"
    name: "纳斯达克100"
  - secid: "hkHSI"
    name: "恒生指数"
  - secid: "hkHSTECH"
    name: "恒生科技"

# --- 监控 ---
monitoring:
  check_interval_seconds: 60  # 轮询间隔（秒）
  trading_hours_only: true    # 仅在交易时段告警（含集合竞价，北京时间）
  alert:
    enabled: false             # 告警总开关：false = 暂停全部告警（阈值/自选/持仓盯盘），行情轮询与快照落库照常
    change_pct: 1.0           # 指数涨跌幅超过 ±1% 告警
    amplitude_pct: 1.5        # 当日振幅超过 1.5% 告警
    board_change_pct: 2.0     # 板块涨跌幅超过 ±2% 告警（板块波动大于指数，单独设阈值）
    etf_change_pct: 2.0       # ETF 涨跌幅超过 ±2% 告警（基金波动小，独立阈值）
    cooldown_minutes: 30      # 同一标的同类告警冷却时间（分钟）

# --- 模拟交易系统 ---
trading:
  enabled: true                 # 是否启用交易系统
  mode: sim                     # 交易通道：sim=模拟撮合（默认）| live=实盘（需券商量化 API 已接入，未接入时下单会被拒绝）
  data_dir: "D:\\CloudDriver\\EVO\\killer"  # 交易数据持久化目录（网盘同步）
  initial_cash: 20000           # 期初现金（元）；账户无任何交易活动时会按此值重新对齐
  commission_rate: 0.00025      # 佣金费率（双边，万2.5）
  min_commission: 5.0           # 最低佣金（元）
  stamp_tax_rate: 0.0005        # 印花税（仅卖出，万5）
  single_position_pct: 30       # 单票仓位上限（%），交易指导按此控制单只买入上限
  max_position_pct: 80          # 总仓位上限（%），超出则不再建议新开仓
  lot_size: 100                 # A股整手股数（买入/卖出按整手给数量）

# --- 分析系统 ---
analysis:
  groups:                        # 分析观察分组（分析页每个分组一个 tab，每家的日报单独存档）
    - name: "AI 算力/半导体"
      watchlist:
        - { secid: "1.688981", name: "中芯国际" }   # 半导体代工
        - { secid: "1.688256", name: "寒武纪" }     # AI 芯片
        - { secid: "1.688041", name: "海光信息" }   # CPU/DCU
        - { secid: "1.601138", name: "工业富联" }   # AI 服务器代工
        - { secid: "0.002463", name: "沪电股份" }   # PCB
        - { secid: "0.002475", name: "立讯精密" }   # 消费电子
    - name: "存储"
      watchlist:
        - { secid: "1.688825", name: "长鑫科技" }   # DRAM 原厂（2026-07-27 科创板上市，原列表建组时还未上市）
        - { secid: "1.603986", name: "兆易创新" }   # NOR Flash / 利基 DRAM
        - { secid: "1.688008", name: "澜起科技" }   # 内存接口芯片 RCD
        - { secid: "0.301308", name: "江波龙" }     # 存储模组
        - { secid: "1.688525", name: "佰维存储" }   # 存储模组
        - { secid: "0.001309", name: "德明利" }     # 主控 + 模组
        - { secid: "1.688110", name: "东芯股份" }   # SLC NAND
        - { secid: "1.688766", name: "普冉股份" }   # NOR / EEPROM
        - { secid: "1.688123", name: "聚辰股份" }   # EEPROM / SPD
        - { secid: "0.000021", name: "深科技" }     # 存储封测
        - { secid: "0.300475", name: "香农芯创" }   # 存储分销
    - name: "半导体设备/材料"
      watchlist:
        # 设备：按前道工艺环节覆盖，国产替代进度最快的平台型 + 单项龙头
        - { secid: "0.002371", name: "北方华创" }   # 刻蚀/薄膜/清洗/炉管 平台型（原在 AI 算力/半导体组，归到本组）
