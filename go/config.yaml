# ============================================================
# 大盘监控系统 (Go) — 全局配置
# ============================================================

server:
  addr: ":8080"              # Web 面板与 API 监听地址

datasource:
  primary: eastmoney         # 主数据源: eastmoney | sina
  fallback: sina             # 备用数据源（主源失败时自动切换）

database:
  path: "D:\\CloudDriver\\EVO\\killer\\market.db"   # SQLite 文件，与交易数据同放网盘同步目录（相对路径则相对启动目录）；WAL 模式，同时只能一台机器跑

# --- 监控的大盘指数 ---
indices:
  - secid: "1.000001"
    name: "上证指数"
  - secid: "0.399001"
    name: "深证成指"
  - secid: "0.399006"
    name: "创业板指"
  - secid: "1.000300"
    name: "沪深300"
  - secid: "1.000688"
    name: "科创50"

# --- 监控的概念/行业板块（腾讯板块代码 pt0xxx）---
# 板块名按喜好改显示名；secid 用 /api/boards?kind=concept 查询腾讯板块代码
boards:
  - secid: "pt02GN2211"
    name: "CPO概念"       # 共封装光模块(CPO)
  - secid: "pt02101284"
    name: "PCB"           # PCB概念
  - secid: "pt02GN2124"
    name: "存储芯片"      # 存储器
  - secid: "pt02GN2006"
    name: "算力概念"      # 东数西算/算力
  - secid: "pt02GN2328"
    name: "半导体设备"    # 半导体设备概念
  - secid: "pt01801780"
    name: "银行"          # 银行（行业）
  - secid: "pt02B20001"
    name: "白酒"          # 白酒概念

# --- 监控的 A股 ETF（secid：1.5xxxxx 沪市 / 0.159xxxx 深市）---
# ETF 是基金，波动通常小于指数和个股，阈值用 etf_change_pct 独立配置（默认 2%）
etfs:
  - secid: "1.510300"
    name: "沪深300ETF"
  - secid: "0.159915"
    name: "创业板ETF"
  - secid: "1.512880"
    name: "证券ETF"
  - secid: "1.510050"
    name: "上证50ETF"
  - secid: "1.588000"
    name: "科创50ETF"
  - secid: "1.510500"
    name: "中证500ETF"
  - secid: "0.159901"
    name: "深100ETF"
  - secid: "1.512000"
    name: "券商ETF"

